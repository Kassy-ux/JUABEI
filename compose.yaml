services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: juabei
      POSTGRES_USER: juabei
      POSTGRES_PASSWORD: juabei
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juabei -d juabei"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - juabei_postgres_data:/var/lib/postgresql/data

volumes:
  juabei_postgres_data:
